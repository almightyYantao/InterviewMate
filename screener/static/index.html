<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>简历筛选与一面准备</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--line:#e3e6ea;--text:#1d2329;--muted:#6b7480;--accent:#2f6fde;--ok:#1f9d55;--warn:#d98a00;--bad:#d64545;--hl:#fff3b0}
*{box-sizing:border-box}body{margin:0;font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
header{display:flex;align-items:center;gap:16px;padding:10px 20px;background:#1d2329;color:#fff}
header b{font-size:15px}header .sp{flex:1}header a{color:#cfd6df;cursor:pointer;text-decoration:none}
main{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 44px)}
aside{border-right:1px solid var(--line);background:var(--card);padding:12px;overflow:auto}
aside .pos{padding:8px 10px;border-radius:6px;cursor:pointer}aside .pos:hover{background:var(--bg)}aside .pos.on{background:#e8f0fd;color:var(--accent)}
section{padding:18px 22px;overflow:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:14px}
h2{font-size:17px;margin:0 0 10px}h3{font-size:15px;margin:16px 0 8px}
button,.btn{font:inherit;border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 12px;cursor:pointer;color:var(--text);text-decoration:none;display:inline-block}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff}button:disabled{opacity:.5}
input,textarea,select{font:inherit;border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%}
textarea{min-height:80px}
table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}th{color:var(--muted);font-weight:500;background:#fafbfc}
.muted{color:var(--muted)}.tag{display:inline-block;padding:0 8px;border-radius:10px;font-size:12px;border:1px solid currentColor}
.d-advance{color:var(--ok)}.d-conditional{color:var(--warn)}.d-reject{color:var(--bad)}
.s-high{color:var(--bad)}.s-medium{color:var(--warn)}.s-low{color:var(--muted)}
.ev{cursor:pointer;color:var(--accent);border-bottom:1px dashed}
.split{display:grid;grid-template-columns:1fr 380px;gap:14px;align-items:start}
.resume{position:sticky;top:10px;max-height:calc(100vh - 80px);overflow:auto;font-size:12.5px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 0}
.resume div{padding:0 10px;white-space:pre-wrap}.resume div span{color:#aab;display:inline-block;width:32px}.resume div.hl{background:var(--hl)}
.banner{background:#fff6e5;border:1px solid #f3d9a4;color:#7a5200;border-radius:6px;padding:6px 10px;margin-bottom:12px;font-size:13px}
details.q{border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin:8px 0;background:#fff}details.q summary{cursor:pointer;font-weight:500}
details.q ul{margin:6px 0 4px;padding-left:18px}.kp{font-weight:600;color:#0a5}
.big{font-size:28px;font-weight:600}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.iv{max-width:860px;margin:0 auto}.iv .qbox{font-size:17px;margin:12px 0}.timer{font-variant-numeric:tabular-nums;font-size:22px}
.sc button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
pre.eval{white-space:pre-wrap;background:#f3f6fa;border-radius:6px;padding:10px}
</style>
</head>
<body>
<header><b>简历筛选与一面准备</b><span class="sp"></span><a onclick="newPosition()">＋ 新建岗位</a></header>
<main>
  <aside id="positions"></aside>
  <section id="view"><div class="muted">左侧选择岗位，或新建岗位。</div></section>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api = async (path, opt = {}) => {
  const r = await fetch(path, {headers: opt.body && !(opt.body instanceof FormData) ? {'Content-Type': 'application/json'} : {}, ...opt});
  if (!r.ok) throw new Error((await r.text()) || r.status);
  return r.json();
};
const DL = {advance: '推进', conditional: '有条件推进', reject: '不推荐'};
const SEV = {high: '高', medium: '中', low: '低'};
const ICON = {match: '✅', partial: '⚠️', missing: '❌', unknown: '❓'};
const LV = {must: '必须', plus: '加分', duty: '职责'};
let state = {pos: null, timer: null};

async function loadPositions() {
  const ps = await api('/positions');
  $('#positions').innerHTML = ps.map(p => `<div class="pos ${state.pos?.id === p.id ? 'on' : ''}" onclick="openPosition('${p.id}')">${esc(p.title)}<div class="muted" style="font-size:12px">${p.jd_struct ? (p.jd_struct.error ? 'JD 解析失败' : p.jd_struct.requirements.length + ' 条要求') : 'JD 解析中…'}</div></div>`).join('') || '<div class="muted">暂无岗位</div>';
  return ps;
}

function newPosition() {
  $('#view').innerHTML = `<div class="card"><h2>新建岗位</h2>
    <p><input id="t" placeholder="岗位名称，如：网络工程师（杭州）"></p>
    <p><textarea id="jd" style="min-height:260px" placeholder="粘贴 JD 原文。需要提高权重的条目用 **加粗**"></textarea></p>
    <p class="muted">公司环境描述（用于出场景题）</p><p><textarea id="ctx"></textarea></p>
    <p class="row">面试时长 <input id="min" type="number" value="60" style="width:80px"> 分钟 <button class="pri" onclick="createPosition()">创建</button></p></div>`;
  $('#ctx').value = '全球办公室：杭州、香港、新加坡、东京、美国；网络设备：FortiGate、FortiSwitch、FortiAP、UniFi；身份系统：Keycloak、Google Workspace；新加坡有 IDC，托管 GPU 服务器。';
}
async function createPosition() {
  const r = await api('/positions', {method: 'POST', body: JSON.stringify({title: $('#t').value, jd_raw: $('#jd').value, company_ctx: $('#ctx').value, interview_minutes: +$('#min').value})});
  await loadPositions(); openPosition(r.id);
}

async function openPosition(id) {
  clearInterval(state.poll);
  const ps = await loadPositions();
  state.pos = ps.find(p => p.id === id); await loadPositions();
  const p = state.pos, js = p.jd_struct && !p.jd_struct.error ? p.jd_struct : null;
  $('#view').innerHTML = `<div class="card"><div class="row"><h2 style="margin:0;flex:1">${esc(p.title)}</h2>
      <label class="btn">上传简历 <input type="file" accept=".pdf,.docx,.md,.txt" multiple hidden onchange="upload(this.files)"></label>
      <button onclick="editPosition()">岗位设置</button></div></div>
    <div class="card"><h3 style="margin-top:0">候选人</h3><div id="cands" class="muted">加载中…</div></div>
    <div class="card"><h3 style="margin-top:0">JD 要求 ${js ? '' : '<span class="muted">（解析中，刷新查看）</span>'}</h3>
    ${js ? `<table><tr><th>ID</th><th>要求</th><th>级别</th><th>权重</th></tr>${js.requirements.map(r => `<tr><td>${r.id}</td><td>${r.emphasized ? '<b>' + esc(r.text) + '</b>' : esc(r.text)}</td><td>${LV[r.level]}</td><td>${r.weight}</td></tr>`).join('')}</table>` : ''}</div>`;
  await loadCands();
  state.poll = setInterval(loadCands, 4000);
}

async function loadCands() {
  if (!state.pos || !$('#cands')) return clearInterval(state.poll);
  const cs = await api(`/positions/${state.pos.id}/candidates`);
  const sort = $('#sortBy')?.value || 'created';
  if (sort === 'score') cs.sort((a, b) => (b.score ?? -1) - (a.score ?? -1));
  $('#cands').innerHTML = cs.length ? `<div class="row" style="margin-bottom:6px">排序 <select id="sortBy" style="width:auto" onchange="loadCands()"><option value="created">上传时间</option><option value="score" ${sort === 'score' ? 'selected' : ''}>匹配分</option></select></div>
    <table><tr><th>候选人</th><th>状态</th><th>匹配分</th><th>结论</th><th>高级疑点</th><th></th></tr>${cs.map(c => `<tr>
      <td>${esc(c.name)}</td><td>${c.status === 'failed' ? `<span class="s-high" title="${esc(c.error)}">失败</span>` : c.status === 'done' ? '完成' : `<span class="muted">${esc(c.progress || c.status)}</span>`}</td>
      <td>${c.score ?? ''}</td><td>${c.decision ? `<span class="tag d-${c.decision}">${DL[c.decision]}</span>` : ''}</td><td>${c.high ?? ''}</td>
      <td>${c.decision ? `<button onclick="openReport('${c.id}')">查看报告</button>` : ''} ${c.status === 'failed' ? `<button onclick="regen('${c.id}','all')">重试</button>` : ''}</td></tr>`).join('')}</table>` : '<span class="muted">还没有简历</span>';
}

async function upload(files) {
  for (const f of files) { const fd = new FormData(); fd.append('file', f); await api(`/positions/${state.pos.id}/candidates`, {method: 'POST', body: fd}); }
  loadCands();
}

function editPosition() {
  const p = state.pos;
  $('#view').innerHTML = `<div class="card"><h2>岗位设置</h2>
    <p><input id="t" value="${esc(p.title)}"></p><p class="muted">JD 原文（修改后会重新解析）</p><p><textarea id="jd" style="min-height:220px">${esc(p.jd_raw)}</textarea></p>
    <p class="muted">要求清单（可直接改 level / weight，JSON）</p><p><textarea id="js" style="min-height:220px;font-family:monospace;font-size:12px">${esc(JSON.stringify(p.jd_struct, null, 1))}</textarea></p>
    <p class="muted">公司环境描述</p><p><textarea id="ctx">${esc(p.company_ctx)}</textarea></p>
    <p class="row">面试时长 <input id="min" type="number" value="${p.interview_minutes}" style="width:80px"> 分钟 <button class="pri" onclick="savePosition()">保存</button> <button onclick="openPosition('${p.id}')">取消</button></p></div>`;
}
async function savePosition() {
  const p = state.pos, body = {title: $('#t').value, company_ctx: $('#ctx').value, interview_minutes: +$('#min').value};
  if ($('#jd').value !== p.jd_raw) body.jd_raw = $('#jd').value; else { try { body.jd_struct = JSON.parse($('#js').value) } catch (e) { return alert('JSON 格式错误') } }
  await api(`/positions/${p.id}`, {method: 'PUT', body: JSON.stringify(body)}); openPosition(p.id);
}

async function regen(cid, stage) { await api(`/candidates/${cid}/regenerate?stage=${stage}`, {method: 'POST'}); openPosition(state.pos.id); }

// ---------- 报告 ----------
const evHtml = evs => (evs || []).map(e => `<span class="ev" onclick="hl(${e.line})">L${e.line}「${esc(e.quote)}」</span>`).join('<br>');
function hl(n) {
  document.querySelectorAll('.resume .hl').forEach(x => x.classList.remove('hl'));
  const el = document.getElementById('L' + n); if (!el) return;
  el.classList.add('hl'); el.scrollIntoView({block: 'center', behavior: 'smooth'});
}

async function openReport(cid) {
  clearInterval(state.poll);
  const d = await api(`/candidates/${cid}/report`); state.rep = d; state.cid = cid;
  const r = d.report, c = r.conclusion, reqs = Object.fromEntries(r.jd.requirements.map(x => [x.id, x]));
  const secs = {}; r.questions.forEach(q => (secs[q.section] ||= []).push(q));
  const src = q => q.source.type === 'resume' ? `简历 ${q.source.lines.map(n => `<span class="ev" onclick="hl(${n})">L${n}</span>`).join(' ')}「${esc(q.source.quote)}」`
    : q.source.type === 'jd' ? 'JD：' + esc(q.linked_requirements.map(i => i + ' ' + (reqs[i]?.text || '')).join('；') || q.source.quote) : '疑点：' + esc(q.linked_doubts.join('、') + ' ' + q.source.quote);
  $('#view').innerHTML = `<div class="banner">⚠️ AI 生成，需人工复核。系统只给出建议，是否推进由面试官决定。出生日期仅用于时间线校验，年龄、性别、婚育、籍贯不参与评分和出题。</div>
  <div class="row" style="margin-bottom:12px"><button onclick="openPosition('${state.pos.id}')">← 返回</button><span class="sp" style="flex:1"></span>
    <span class="muted">版本 v${d.version}</span>
    <a class="btn" href="/reports/${d.id}/export?format=md">导出 Markdown</a><a class="btn" href="/reports/${d.id}/export?format=docx">导出 Word</a>
    <a class="btn" href="/reports/${d.id}/export?format=docx&answers=false">面试记录表</a>
    <button onclick="regen('${cid}','questions')">重新出题</button><button class="pri" onclick="interview()">进入面试模式</button></div>
  <div class="split"><div>
  <div class="card"><div class="row"><span class="big d-${c.decision}">${DL[c.decision]}</span><span class="big">${c.score}<span class="muted" style="font-size:14px">/10</span></span></div>
    <p>${esc(c.summary)}</p>${c.veto.length ? `<p class="s-high">一票否决：${c.veto.map(v => v + ' ' + esc(reqs[v]?.text || '')).join('；')}（结论上限为「有条件推进」）</p>` : ''}
    <p class="muted">必须核实：${esc(c.must_verify.join('、'))}</p></div>
  <div class="card"><h3 style="margin-top:0">简历疑点</h3><table><tr><th>疑点</th><th>级别</th><th>原文证据</th><th>建议核实问题</th></tr>
    ${r.doubts.slice().sort((a, b) => ['high', 'medium', 'low'].indexOf(a.severity) - ['high', 'medium', 'low'].indexOf(b.severity)).map(x => `<tr><td>${esc(x.title)} <span class="muted">${x.source === 'rule' ? '规则' : '语义'}</span></td><td class="s-${x.severity}">${SEV[x.severity]}</td><td>${evHtml(x.evidence) || '—'}</td><td>${esc(x.verify_question)}</td></tr>`).join('')}</table></div>
  <div class="card"><h3 style="margin-top:0">JD 匹配度</h3><table><tr><th>要求</th><th>级别/权重</th><th></th><th>证据 / 备注</th></tr>
    ${r.match.map(m => { const q = reqs[m.req_id] || {}; return `<tr><td>${m.req_id} ${q.emphasized ? '<b>' + esc(q.text) + '</b>' : esc(q.text)}</td><td>${LV[q.level] || ''} / ${q.weight ?? ''}</td><td>${ICON[m.verdict]}</td><td>${esc(m.reason)}${m.evidence.length ? '<br>' + evHtml(m.evidence) : ''}</td></tr>` }).join('')}</table></div>
  <div class="card"><h3 style="margin-top:0">面试题与参考答案（共 ${r.questions.reduce((s, q) => s + q.minutes, 0)} 分钟）</h3>
    ${Object.entries(secs).map(([s, qs]) => `<h3>${s}（${qs.reduce((a, q) => a + q.minutes, 0)} 分钟）</h3>` + qs.map(q => `<details class="q"><summary>${q.id}. ${esc(q.question)} <span class="muted">${q.minutes} 分钟</span></summary>
      <div class="muted">来源：${src(q)}</div>
      <ul>${q.answer_points.map(p => `<li class="${q.key_points.includes(p) ? 'kp' : ''}">${esc(p)}</li>`).join('')}</ul>
      <div><b>追问：</b>${esc(q.follow_ups.join('；'))}</div><div><b>🚩 红旗：</b>${esc(q.red_flags.join('；'))}</div>
      <div><b>评分：</b>优秀 — ${esc(q.rubric.excellent)}；合格 — ${esc(q.rubric.pass)}；不合格 — ${esc(q.rubric.fail)}</div>
      <p><button onclick="delQ('${q.id}')">删除此题</button></p></details>`).join('')).join('')}</div>
  <div class="card"><h3 style="margin-top:0">评价建议</h3><p>通过信号：${esc(c.pass_signals.join('；'))}</p><p>不通过信号：${esc(c.fail_signals.join('；'))}</p>
    ${d.evaluations.map(e => `<p><b>第 ${e.round} 轮评价（${esc(e.decision)}）</b></p><pre class="eval">${esc(e.comment)}</pre>`).join('')}</div>
  </div><div class="resume">${d.resume_lines.map((l, i) => `<div id="L${i + 1}"><span>${i + 1}</span>${esc(l)}</div>`).join('')}</div></div>`;
}

async function delQ(qid) {
  if (!confirm('删除 ' + qid + '？')) return;
  const qs = state.rep.report.questions.filter(q => q.id !== qid);
  await api(`/reports/${state.rep.id}`, {method: 'PATCH', body: JSON.stringify({questions: qs})});
  openReport(state.cid);
}

// ---------- 面试模式 ----------
function interview() {
  const qs = state.rep.report.questions, saved = Object.fromEntries(state.rep.scores.map(s => [s.question_id, s]));
  state.iv = {i: 0, start: Date.now(), qStart: Date.now(), scores: Object.fromEntries(qs.map(q => [q.id, {score: saved[q.id]?.score || null, note: saved[q.id]?.note || ''}]))};
  clearInterval(state.timer); state.timer = setInterval(tick, 1000); drawIv();
}
function tick() {
  const f = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  const q = state.rep.report.questions[state.iv.i], qs = Math.floor((Date.now() - state.iv.qStart) / 1000);
  if ($('#tAll')) $('#tAll').textContent = f(Math.floor((Date.now() - state.iv.start) / 1000));
  if ($('#tQ')) { $('#tQ').textContent = f(qs); $('#tQ').style.color = q && qs > q.minutes * 60 ? 'var(--bad)' : ''; }
}
function drawIv() {
  const r = state.rep.report, qs = r.questions, i = state.iv.i, q = qs[i];
  if (!q) return finishIv();
  const s = state.iv.scores[q.id];
  $('#view').innerHTML = `<div class="iv"><div class="row"><button onclick="saveScores().then(()=>openReport(state.cid))">退出面试模式</button><span style="flex:1"></span>
    总计 <span class="timer" id="tAll"></span>　本题 <span class="timer" id="tQ"></span> / ${q.minutes}:00</div>
    <div class="card"><div class="muted">${i + 1} / ${qs.length} · ${q.section}</div><div class="qbox"><b>${esc(q.question)}</b></div>
      <details><summary class="muted">参考答案</summary><ul>${q.answer_points.map(p => `<li class="${q.key_points.includes(p) ? 'kp' : ''}">${esc(p)}</li>`).join('')}</ul>
        <div>追问：${esc(q.follow_ups.join('；'))}</div><div>🚩 ${esc(q.red_flags.join('；'))}</div>
        <div class="muted">优秀 — ${esc(q.rubric.excellent)}；合格 — ${esc(q.rubric.pass)}；不合格 — ${esc(q.rubric.fail)}</div></details>
      <p class="row sc">${['excellent', 'pass', 'fail'].map(k => `<button class="${s.score === k ? 'on' : ''}" onclick="setScore('${k}')">${{excellent: '优秀', pass: '合格', fail: '不合格'}[k]}</button>`).join('')}</p>
      <textarea id="note" placeholder="备注：候选人的具体表现">${esc(s.note)}</textarea>
      <p class="row"><button onclick="go(-1)" ${i ? '' : 'disabled'}>上一题</button><span style="flex:1"></span><button class="pri" onclick="go(1)">${i === qs.length - 1 ? '结束面试' : '下一题'}</button></p></div></div>`;
  tick();
}
function setScore(k) { state.iv.scores[state.rep.report.questions[state.iv.i].id].score = k; keepNote(); drawIv(); }
function keepNote() { const q = state.rep.report.questions[state.iv.i]; if (q && $('#note')) state.iv.scores[q.id].note = $('#note').value; }
async function go(d) { keepNote(); await saveScores(); state.iv.i += d; state.iv.qStart = Date.now(); drawIv(); }
async function saveScores() {
  keepNote();
  const items = Object.entries(state.iv.scores).filter(([, v]) => v.score || v.note).map(([k, v]) => ({question_id: k, ...v}));
  if (items.length) await api(`/reports/${state.rep.id}/scores`, {method: 'POST', body: JSON.stringify(items)});
}
function finishIv() {
  clearInterval(state.timer);
  const n = Object.values(state.iv.scores), cnt = k => n.filter(x => x.score === k).length;
  $('#view').innerHTML = `<div class="iv card"><h2>面试结束</h2><p>优秀 ${cnt('excellent')} · 合格 ${cnt('pass')} · 不合格 ${cnt('fail')} · 未打分 ${cnt(null)}</p>
    <p class="muted">整体备注（疑点核实结果、英语、到岗时间等）</p><textarea id="overall"></textarea>
    <p class="row"><button class="pri" id="gen" onclick="genEval()">生成口语化评价</button><button onclick="openReport(state.cid)">返回报告</button></p><div id="evalOut"></div></div>`;
}
async function genEval() {
  $('#gen').disabled = true; $('#evalOut').innerHTML = '<p class="muted">生成中…</p>';
  try {
    const e = await api(`/candidates/${state.cid}/evaluation`, {method: 'POST', body: JSON.stringify({round: 1, overall_note: $('#overall').value})});
    $('#evalOut').innerHTML = `<p><b>${esc(e.decision)}</b></p><pre class="eval">${esc(e.comment)}</pre><button onclick="navigator.clipboard.writeText(${JSON.stringify(e.comment).replace(/"/g, '&quot;')})">复制</button>`;
  } catch (err) { $('#evalOut').textContent = '失败：' + err.message; }
  $('#gen').disabled = false;
}
loadPositions();
</script>
</body>
</html>
