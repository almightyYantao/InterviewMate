[project]
name = "resume-screener"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "fastapi>=0.162.0",
    "pdfplumber>=0.11.10",
    "pydantic>=2.14.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "pywebview>=6.2.1",
    "rapidfuzz>=3.14.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
